<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QSAP License System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@200;300;400;600;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; }
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-gray-100" x-data="{ sidebarOpen: false }">

    <!-- Mobile Overlay -->
    <div x-show="sidebarOpen" @click="sidebarOpen = false" x-transition:enter="transition-opacity ease-linear duration-300" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100" x-transition:leave="transition-opacity ease-linear duration-300" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0" class="fixed inset-0 bg-black bg-opacity-50 z-20 md:hidden" x-cloak></div>

    <!-- Sidebar -->
    <div class="flex h-screen overflow-hidden">
        <div :class="sidebarOpen ? 'translate-x-0' : 'translate-x-full'" class="bg-gray-800 text-white w-64 flex-shrink-0 flex flex-col fixed inset-y-0 right-0 z-30 transition-transform duration-300 transform md:relative md:translate-x-0">
            <div class="p-4 text-center text-2xl font-bold border-b border-gray-700 flex justify-between items-center md:justify-center">
                <span>QSAP Admin</span>
                <button @click="sidebarOpen = false" class="md:hidden text-gray-400 hover:text-white focus:outline-none">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <nav class="flex-1 overflow-y-auto py-4">
                <a href="{{ url_for('admin.dashboard') }}" class="block px-4 py-2 hover:bg-gray-700 {{ 'bg-gray-700' if request.endpoint == 'admin.dashboard' }}">
                    <i class="fas fa-tachometer-alt ml-2"></i> لوحة التحكم
                </a>
                <a href="{{ url_for('admin.schools') }}" class="block px-4 py-2 hover:bg-gray-700 {{ 'bg-gray-700' if 'schools' in request.endpoint }}">
                    <i class="fas fa-school ml-2"></i> المدارس والتراخيص
                </a>
                <a href="{{ url_for('admin.backups') }}" class="block px-4 py-2 hover:bg-gray-700 {{ 'bg-gray-700' if 'backups' in request.endpoint }}">
                    <i class="fas fa-database ml-2"></i> النسخ الاحتياطية
                </a>
                <a href="{{ url_for('admin.logs') }}" class="block px-4 py-2 hover:bg-gray-700 {{ 'bg-gray-700' if 'logs' in request.endpoint }}">
                    <i class="fas fa-history ml-2"></i> السجلات
                </a>
                <a href="{{ url_for('admin.users') }}" class="block px-4 py-2 hover:bg-gray-700 {{ 'bg-gray-700' if 'users' in request.endpoint }}">
                    <i class="fas fa-users ml-2"></i> المستخدمين
                </a>
                <a href="{{ url_for('emergency.index') }}" class="block px-4 py-2 hover:bg-red-900 text-red-300 hover:text-white {{ 'bg-red-900 text-white' if 'emergency' in request.endpoint }}">
                    <i class="fas fa-user-shield ml-2"></i> نظام الطوارئ
                </a>
            </nav>
            <div class="p-4 border-t border-gray-700">
                <a href="{{ url_for('admin.logout') }}" class="block px-4 py-2 hover:bg-red-600 rounded text-center">
                    <i class="fas fa-sign-out-alt ml-2"></i> تسجيل خروج
                </a>
            </div>
        </div>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col overflow-hidden">
            <header class="bg-white shadow p-4 flex justify-between items-center md:hidden">
                <div class="font-bold text-xl">QSAP Admin</div>
                <button @click="sidebarOpen = !sidebarOpen" class="text-gray-600 focus:outline-none">
                    <i class="fas fa-bars"></i>
                </button>
            </header>

            <main class="flex-1 overflow-x-hidden overflow-y-auto bg-gray-100 p-6">
                {% with messages = get_flashed_messages() %}
                    {% if messages %}
                        {% for message in messages %}
                            <div class="bg-blue-100 border-r-4 border-blue-500 text-blue-700 p-4 mb-4 rounded shadow" role="alert">
                                <p>{{ message }}</p>
                            </div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}

                {% block content %}{% endblock %}
            </main>
        </div>
    </div>

</body>
</html>
